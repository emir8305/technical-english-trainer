</style></head><body><div class="wrap"><header><div><div class="eyebrow">END201 · Teknik İngilizce I</div><h1>Technical English Trainer</h1><div class="muted">Slaytlarından öğren, test et, tekrar et.</div></div><span class="pill">Mobil + Masaüstü</span></header><div class="tabs" id="tabs"><button data-tab="home" class="active">🏠 Ana sayfa</button><button data-tab="cards">🗂️ Kelime kartları</button><button data-tab="quiz">📝 Test</button><button data-tab="sentences">📖 Cümleler</button><button data-tab="words">📚 Sözlük</button></div><main id="content"></main><div class="footer">Kaynak: END201 ders tanıtımı (10 sayfa) ve Ayrık Olay Simülasyonu ile İlgili Akademik Çeviri ve Teknik Terimler (42 sayfa). Veriler bu cihazın tarayıcısında tutulur.</div></div><script>

const words=raw.split('\n').map((x,i)=>{let [en,tr,page]=x.split('|');return{id:i,en,tr,page,source:page.startsWith('Tanıtım')?'intro':'sim'}});
const sentences=[
['In our study, patient arrivals, investigation for treatment (severity of injuries), waiting time for treatment, treatment time, and overall waiting time are probabilistic and thus, statistical distributions are considered.','Çalışmamızda hasta gelişleri, tedavi için inceleme (yaralanmaların şiddeti), tedavi öncesi bekleme süresi, tedavi süresi ve toplam bekleme süresi olasılıksaldır; dolayısıyla istatistiksel dağılımlar dikkate alınır.',4],
['In addition, patient arrivals and processes of the hospital are discrete and have discrete time intervals.','Ayrıca, hasta gelişleri ve hastanenin süreçleri kesiklidir ve kesikli zaman aralıklarına sahiptir.',6],

['The local data were provided by the hospital, that is, the number doctors, nurses, beds, triage room, etc.','Yerel veriler, yani doktor, hemşire, yatak ve triyaj odası sayısı vb. hastane tarafından sağlanmıştır.',17],

['This means that firstly, a hospital should be conceptualised and after that, a simulation model should be developed.','Bu, öncelikle bir hastanenin kavramsallaştırılması ve ardından bir simülasyon modeli geliştirilmesi gerektiği anlamına gelir.',24],

const key='end201trainer_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};let state={known:saved.known||{},attempts:saved.attempts||{},tab:'home',cardIndex:0,flipped:false,filter:'all',quiz:null,sentence:0,showSentence:false,search:''};const $=id=>document.getElementById(id);function persist(){localStorage.setItem(key,JSON.stringify({known:state.known,attempts:state.attempts}))}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function pool(){return words.filter(w=>state.filter==='all'||(state.filter==='missed'&&state.known[w.id]===false)||(state.filter==='new'&&state.known[w.id]===undefined)||(state.filter==='known'&&state.known[w.id]===true))}function pct(n,d){return d?Math.round(n/d*100):0}function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const known=Object.values(state.known).filter(Boolean).length,missed=Object.values(state.known).filter(v=>v===false).length;let html='';if(state.tab==='home'){html=`<section class="panel"><h2>Öğrenme durumun</h2><div class="grid"><div class="stat"><b>${words.length}</b><small>Toplam kelime / terim</small></div><div class="stat"><b>${known}</b><small>Öğrenilen</small></div><div class="stat"><b>${missed}</b><small>Tekrar edilecek</small></div></div><div class="progress"><div style="width:${pct(known,words.length)}%"></div></div><p class="hint">Kelime ilerlemesi: %${pct(known,words.length)} · ${words.length-known-missed} henüz değerlendirilmemiş kelime</p><div class="row"><button class="primary" onclick="go('cards')">Kelime öğrenmeye başla</button><button class="ghost" onclick="startQuiz(false)">10 soruluk test</button><button class="ghost" onclick="go('sentences')">Cümle çalış</button></div></section><section class="panel"><h2>Kaynaklar</h2><p>📘 <b>Dersin Tanıtımı ve Teknik İngilizce I’e Giriş</b> — 10 sayfa</p><p>📗 <b>Ayrık Olay Simülasyonu ile İlgili Akademik Çeviri ve Teknik Terimler</b> — 42 sayfa</p><p class="hint">Aynı cümlenin İngilizce ve Türkçe verildiği ardışık slaytlar tek çalışma cümlesi olarak birleştirildi. Bazı çeviriler Türkçede daha anlaşılır olacak şekilde düzenlendi. Sayfa numaraları PDF içindeki sayfalardır.</p><div class="row"><button class="ghost" onclick="exportData()">İlerlemeyi dışa aktar</button><button class="ghost" onclick="$('importFile').click()">İlerleme dosyası yükle</button><input id="importFile" class="hide" type="file" accept="application/json" onchange="importData(event)"></div></section>`}
if(state.tab==='cards'){let arr=pool();state.cardIndex=Math.min(state.cardIndex,Math.max(0,arr.length-1));let w=arr[state.cardIndex];html=`<section class="panel"><div class="row between"><h2>Kelime kartları</h2><select onchange="state.filter=this.value;state.cardIndex=0;state.flipped=false;render()"><option value="all" ${state.filter==='all'?'selected':''}>Tüm kelimeler</option><option value="new" ${state.filter==='new'?'selected':''}>Henüz çalışılmayanlar</option><option value="missed" ${state.filter==='missed'?'selected':''}>Bilmediklerim</option><option value="known" ${state.filter==='known'?'selected':''}>Bildiklerim</option></select></div>${w?`<div class="row between"><span class="hint">Kart ${state.cardIndex+1} / ${arr.length}</span><span class="hint">${w.source==='intro'?'Tanıtım':'Simülasyon'} · Sayfa ${w.page}</span></div><div class="progress"><div style="width:${pct(state.cardIndex+1,arr.length)}%"></div></div><div class="flash" onclick="state.flipped=!state.flipped;render()"><span class="tag">${state.flipped?'TÜRKÇE ANLAMI':'İNGİLİZCE TERİM'}</span><strong>${state.flipped?w.tr:w.en}</strong><p class="muted">${state.flipped?'Tekrar çevirmek için dokun':'Anlamını görmek için dokun'}</p></div><div class="row between"><button class="ghost" onclick="speak('${w.id}')">🔊 Dinle</button><div class="row"><button class="ghost" onclick="mark(false)">✕ Bilmiyorum</button><button class="primary" onclick="mark(true)">✓ Biliyorum</button></div></div><div class="row" style="margin-top:15px"><button class="ghost" onclick="nextCard(-1)">← Önceki</button><button class="ghost" onclick="nextCard(1)">Sonraki →</button></div>`:`<p>Bu filtrede kelime bulunmuyor.</p><button onclick="state.filter='all';render()">Tüm kelimeleri göster</button>`}</section>`}
if(state.tab==='quiz'){if(!state.quiz)html=`<section class="panel"><h2>Çoktan seçmeli test</h2><p class="muted">Sorular rastgele seçilir. Yanlışların tekrar listene eklenir.</p><div class="row"><button class="primary" onclick="startQuiz(false)">10 soruluk test</button><button class="ghost" onclick="startQuiz(true)">Sadece bilmediklerim</button></div></section>`;else{let q=state.quiz;if(q.index>=q.questions.length){html=`<section class="panel"><h2>Test tamamlandı 🎉</h2><div class="stat"><b>%${pct(q.score,q.questions.length)}</b><small>${q.score} / ${q.questions.length} doğru</small></div><p class="hint">Yanlış yanıtladığın kelimeler tekrar listene işlendi.</p><button class="primary" onclick="startQuiz(false)">Yeni test</button><button class="ghost" onclick="state.quiz=null;render()">Test menüsü</button></section>`}else{let item=q.questions[q.index];html=`<section class="panel"><div class="row between"><h2>Test</h2><span class="hint">${q.index+1} / ${q.questions.length} · ${q.score} doğru</span></div><div class="progress"><div style="width:${pct(q.index,q.questions.length)}%"></div></div><p class="muted">Bu terimin Türkçe karşılığı nedir?</p><h1>${item.word.en}</h1><div class="choices">${item.options.map((o,i)=>`<button ${q.answered!==null?'disabled':''} class="${q.answered!==null?(o.id===item.word.id?'good':i===q.answered?'bad':''):''}" onclick="answer(${i})">${String.fromCharCode(65+i)}) ${o.tr}</button>`).join('')}</div>${q.answered!==null?`<p class="feedback">${item.options[q.answered].id===item.word.id?'✅ Doğru!':'❌ Yanlış. Doğru cevap: '+item.word.tr}</p><button class="primary" onclick="advance()">${q.index===q.questions.length-1?'Sonucu göster':'Sonraki soru →'}</button>`:''}</section>`}}}
if(state.tab==='sentences'){let s=sentences[state.sentence];html=`<section class="panel"><div class="row between"><h2>Cümle çevirisi</h2><span class="hint">${state.sentence+1} / ${sentences.length}</span></div><p class="hint">Simülasyon slaytı · Sayfa ${s[2]} (Türkçe çevirisi genellikle sonraki sayfada)</p><div class="flash" style="cursor:default;min-height:200px"><span class="tag">İNGİLİZCE CÜMLE</span><p style="font-size:clamp(17px,3vw,22px)">${s[0]}</p></div><div class="row"><button class="ghost" onclick="saySentence()">🔊 Dinle</button><button class="primary" onclick="state.showSentence=!state.showSentence;render()">${state.showSentence?'Çeviriyi gizle':'Türkçesini göster'}</button></div>${state.showSentence?`<div class="stat" style="margin-top:15px;line-height:1.7">${s[1]}</div>`:''}<div class="row" style="margin-top:18px"><button class="ghost" onclick="changeSentence(-1)">← Önceki</button><button class="ghost" onclick="changeSentence(1)">Sonraki →</button></div></section>`}
if(state.tab==='words'){let filtered=words.filter(w=>(w.en+' '+w.tr).toLocaleLowerCase('tr').includes(state.search.toLocaleLowerCase('tr')));html=`<section class="panel"><h2>Kelime sözlüğü (${words.length})</h2><input id="search" placeholder="İngilizce veya Türkçe kelime ara..." value="${state.search.replace(/"/g,'&quot;')}" oninput="state.search=this.value;renderWords()" style="width:100%;padding:14px;background:#1c2e48;color:white;border:1px solid #3d567b;border-radius:11px;margin-bottom:12px"><div id="wordlist">${wordRows(filtered)}</div></section>`}
$('content').innerHTML=html}
function wordRows(arr){return arr.map(w=>`<div class="wordrow"><div><b>${w.en}</b><small>${w.source==='intro'?'Tanıtım':'Simülasyon'} · s. ${w.page}</small></div><div class="translation">${w.tr}</div><button class="ghost" title="Seslendir" onclick="speak(${w.id})">🔊</button></div>`).join('')||'<p class="muted">Eşleşen kelime yok.</p>'}function renderWords(){$('wordlist').innerHTML=wordRows(words.filter(w=>(w.en+' '+w.tr).toLocaleLowerCase('tr').includes(state.search.toLocaleLowerCase('tr'))))}function go(t){state.tab=t;state.flipped=false;render();scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));function nextCard(n){let a=pool();state.cardIndex=(state.cardIndex+n+a.length)%a.length;state.flipped=false;render()}function mark(v){let a=pool(),w=a[state.cardIndex];state.known[w.id]=v;persist();state.flipped=false;state.cardIndex=state.filter==='all'?((state.cardIndex+1)%a.length):Math.min(state.cardIndex,Math.max(0,pool().length-1));render()}function startQuiz(missed){let candidates=missed?words.filter(w=>state.known[w.id]===false):words;if(!candidates.length){alert('Önce kelime kartlarında bilmediğin kelimeleri işaretle.');return}let picked=shuffle(candidates).slice(0,10);state.quiz={index:0,score:0,answered:null,questions:picked.map(w=>({word:w,options:shuffle([w,...shuffle(words.filter(x=>x.id!==w.id)).slice(0,3)])}))};go('quiz')}function answer(i){let q=state.quiz;if(q.answered!==null)return;q.answered=i;let item=q.questions[q.index],right=item.options[i].id===item.word.id;if(right)q.score++;state.known[item.word.id]=right;state.attempts[item.word.id]=(state.attempts[item.word.id]||0)+1;persist();render()}function advance(){state.quiz.index++;state.quiz.answered=null;render()}function changeSentence(n){state.sentence=(state.sentence+n+sentences.length)%sentences.length;state.showSentence=false;render()}function utter(t){if(!('speechSynthesis'in window)){alert('Tarayıcın seslendirmeyi desteklemiyor.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}function speak(id){utter(words[id].en)}function saySentence(){utter(sentences[state.sentence][0])}function exportData(){let blob=new Blob([JSON.stringify({known:state.known,attempts:state.attempts},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='END201_ilerleme.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(typeof d.known!=='object'||!d.known)throw Error();state.known=d.known;state.attempts=d.attempts||{};persist();render();alert('İlerleme yüklendi.')}catch{alert('Geçersiz ilerleme dosyası.')}};r.readAsText(f)}render();
</script></body></html>
